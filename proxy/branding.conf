# Capa de marca: se sienta entre el nginx de Hestia y Postiz e inyecta brand.css y brand.js
# en cada página HTML. Así la imagen oficial de Postiz queda intacta y se puede
# actualizar sin perder la personalización.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 1g;
    server_tokens off;

    # Cabeceras de seguridad. Se quitan las que mande Postiz para no duplicarlas.
    # (Ninguna location usa add_header, así que todas las heredan.)
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Archivos de marca (carpeta ./branding del repo)
    location /prisma-brand/ {
        alias /usr/share/nginx/brand/;
        expires epoch;   # Cache-Control: no-cache, sin perder las cabeceras de arriba
    }

    location = /favicon.ico {
        alias /usr/share/nginx/brand/favicon.ico;
    }

    # Enlaces rastreables (/r/…) y registro del cliente (/c/…): públicos, los atiende
    # la app de reportes.
    location ~ ^/(r|c)/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $reportes http://reportes:8080;
        proxy_pass $reportes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 64k;
    }

    # Reportes de resultados (carpeta ./reportes del repo). El nombre se resuelve en
    # cada petición para que nginx arranque aunque el contenedor de reportes no esté.
    location /reportes {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $reportes http://reportes:8080;
        proxy_pass $reportes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://postiz:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # La IP real del visitante la manda el nginx de Hestia; $remote_addr aquí sería la de Docker.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;

        # sub_filter no puede modificar respuestas comprimidas
        proxy_set_header Accept-Encoding "";

        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/prisma-brand/brand.css"><script src="/prisma-brand/brand.js" defer></script></head>';
    }
}
