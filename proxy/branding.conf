# Capa de marca: se sienta entre Caddy y Postiz e inyecta brand.css y brand.js
# en cada página HTML. Así la imagen oficial de Postiz queda intacta y se puede
# actualizar sin perder la personalización.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 1g;

    # Archivos de marca (carpeta ./branding del repo)
    location /prisma-brand/ {
        alias /usr/share/nginx/brand/;
        add_header Cache-Control "no-cache";
    }

    location = /favicon.ico {
        alias /usr/share/nginx/brand/favicon.ico;
    }

    location / {
        proxy_pass http://postiz:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;

        # sub_filter no puede modificar respuestas comprimidas
        proxy_set_header Accept-Encoding "";

        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/prisma-brand/brand.css"><script src="/prisma-brand/brand.js" defer></script></head>';
    }
}
